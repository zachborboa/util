# Pre-commit git hooks.
#
# Usage:
#   1. Run one of:
#     $ pip install pre-commit
#     $ brew install pre-commit
#
#   2. Install hooks
#     $ pre-commit install
#
#   3. Optionally, enable automatic updates
#     $ pre-commit autoupdate
repos:
- repo: local
  hooks:
  - id: google-calendar-move-to-date-test
    name: google-calendar-move-to-date-test
    language: script
    files: 'extensions/google_calendar_workflow/js/.*'
    entry: scripts/google_calendar_move_to_date_test.sh
  # Format staged JavaScript; style lives in .prettierrc.json and vendored libraries in .prettierignore.
  - additional_dependencies:
    - prettier@3.9.10
    args:
    - --log-level=warn
    - --write
    entry: prettier
    id: prettier
    language: node
    name: prettier
    types:
    - javascript
  # Regenerate READMEs from every manifest on each commit, so an added, renamed or deleted extension can't leave them stale.
  - always_run: true
    entry: scripts/update_readme.sh
    id: update-readme
    language: script
    name: update-readme
    pass_filenames: false
