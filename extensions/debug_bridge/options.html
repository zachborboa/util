<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Debug Bridge</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                margin: 2em;
                max-width: 60em;
            }
            code {
                background: #f2f2f2;
                display: block;
                padding: 0.75em;
                white-space: pre-wrap;
                word-break: break-all;
            }
        </style>
    </head>
    <body>
        <h1>Debug Bridge</h1>
        <p>Save this pairing token once by running the command in a terminal. The server start script reads it from there; the extension refuses commands from a server without it.</p>
        <code id="save-token-command"></code>
        <p>
            <button id="copy-save-token-command" type="button" disabled>Copy</button>
            <span id="copy-status" role="status"></span>
        </p>
        <script src="js/options.js"></script>
    </body>
</html>
